# Application Next.js en local. Supabase (base, Auth, Studio, mails de test) est lancé
# à part par la CLI Supabase, qui gère ses propres conteneurs : passer par `make up`.
name: off-the-map

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: true
      # Clés locales de Supabase, générées par `make up` (jamais versionnées).
      - path: .env.supabase
        required: false
    depends_on:
      - simulateur
    environment:
      # Depuis le conteneur, Supabase est joignable par l'hôte et non par localhost.
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      # node_modules et .next restent ceux du conteneur (binaires Linux).
      - /app/node_modules
      - /app/.next

  # Simulateur du formateur (E0.17) : construit directement depuis le dépôt du cours (aucun clone à faire).
  # Bibliothèque standard Python seulement. --demo : clés de démonstration (demo-key / demo-approval).
  simulateur:
    build:
      context: ${SIMULATEUR_SRC:-https://github.com/PANDORMedia/gestion-projet-agentique-web3.git#main}
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /srv
        COPY . /srv
        EXPOSE 8765
        CMD ["python3", "server/app.py", "--demo", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${SIMULATEUR_PORT:-8765}:8765"
