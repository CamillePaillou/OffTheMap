# CI minimale : lint, types, tests, build et détection de secrets.
# Elle réussit tant que le projet Next.js n'existe pas encore (aucun package-lock.json) :
# les contrôles « ci » et « secrets » apparaissent ainsi dans la liste des contrôles exigeables dès la première PR.
# Quand le projet aura ses scripts lint, typecheck, test et build, retirer les --if-present.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read   # gitleaks lit la liste des commits de la PR

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('package-lock.json') != ''
        run: npm run lint --if-present

      - name: Types
        if: hashFiles('package-lock.json') != ''
        run: npm run typecheck --if-present

      - name: Tests
        if: hashFiles('package-lock.json') != ''
        run: npm test --if-present

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build --if-present

      - name: Aucun projet pour l'instant
        if: hashFiles('package-lock.json') == ''
        run: echo "Pas de package-lock.json, rien à vérifier pour l'instant."

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Détection de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Applique les migrations sur un PostgreSQL nu (auth et rôles Supabase remplacés par un stub),
  # puis vérifie les contraintes et les accès du schéma.
  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Stub Supabase (schéma auth, rôles)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/scripts/stub_supabase.sql
      - name: Migrations
        run: for f in supabase/migrations/*.sql; do echo "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Tests du schéma
        run: psql -q -f supabase/scripts/test_contraintes.sql
